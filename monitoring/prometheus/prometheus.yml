global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "kafka"
    static_configs:
      - targets: ["kafka-exporter:9308"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "kafka"

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "clickhouse"
    static_configs:
      - targets: ["clickhouse-exporter:9116"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "spark"
    metrics_path: /metrics/executors/prometheus/
    static_configs:
      - targets:
          - "spark-streaming-orders:4040"
          - "spark-streaming-payments:4040"
          - "spark-streaming-rider-events:4040"
