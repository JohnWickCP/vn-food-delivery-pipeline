global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Spark streaming driver UIs — only available while a job is running
  - job_name: "spark"
    metrics_path: /metrics/executors/prometheus/
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "spark-streaming-orders:4040"
          - "spark-streaming-payments:4040"
          - "spark-streaming-rider-events:4040"
