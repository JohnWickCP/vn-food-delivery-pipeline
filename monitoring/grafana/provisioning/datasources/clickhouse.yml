apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse-food-delivery
    type: grafana-clickhouse-datasource
    access: proxy
    jsonData:
      server: clickhouse
      port: 8123
      protocol: http
      defaultDatabase: food_delivery_dbt_marts
      username: $CLICKHOUSE_USER
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD
    editable: false
