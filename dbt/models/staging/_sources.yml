version: 2

sources:
  - name: food_delivery
    database: food_delivery
    description: "Raw tables populated in real-time via ClickHouse Kafka Engine (v3 architecture). MinIO Parquet = cold storage / replay only."
    tables:
      - name: raw_orders
        description: "Orders emitted by the generator, partitioned by month"
        columns:
          - name: order_id
            description: "UUID — primary key"
          - name: items
            description: "JSON array string: [{item_id, name, price_vnd, quantity}]"

      - name: raw_payments
        description: "One payment per order, processed 10s-3min after order event"

      - name: raw_rider_events
        description: "GPS pings every 30s per rider (200 riders)"
