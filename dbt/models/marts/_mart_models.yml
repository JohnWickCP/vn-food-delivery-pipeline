version: 2

models:
  - name: fct_orders
    description: "Core fact table — one row per order, joined with payment. Star schema center."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: city
        tests:
          - not_null
      - name: placed_date
        tests:
          - not_null
      - name: total_vnd
        tests:
          - not_null

  - name: dim_restaurant
    description: "Restaurant dimension — lifetime aggregates per restaurant."
    columns:
      - name: restaurant_id
        tests:
          - not_null
      - name: total_orders
        tests:
          - not_null

  - name: dim_rider
    description: "Rider dimension — lifetime performance metrics."
    columns:
      - name: rider_id
        tests:
          - not_null

  - name: rpt_hourly_revenue
    description: "Hourly business metrics per city — feed for Grafana dashboard."
    columns:
      - name: city
        tests:
          - not_null
      - name: hour_bucket
        tests:
          - not_null
